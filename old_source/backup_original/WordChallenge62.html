<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>2022개정교육과정 추천어휘 [초등] 62회</title>
<style>
  body{font-family:'Comic Sans MS','Arial';background:#1e1e2f;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    height:100vh;margin:0;}
  h1{font-size:1.5rem;color:#d6aaff;margin-bottom:8px;}
  .index{font-size:1.2rem;color:#ccbaff;margin-bottom:10px;}
  .card{font-size:2rem;padding:30px 50px;background:#2e2e3e;
    border:3px solid #a675f7;border-radius:25px;text-align:center;
    box-shadow:0 0 15px rgba(0,0,0,0.1);min-width:280px;color:#e6d0ff;}
  .image{margin-top:15px;width:160px;height:160px;background:#444;
    border:3px solid #eacbff;border-radius:20px;background-size:contain;
    background-position:center;background-repeat:no-repeat;display:flex;
    align-items:center;justify-content:center;font-size:1rem;color:#ccc;}
  .controls{margin-top:25px;display:flex;flex-wrap:wrap;gap:10px;
    justify-content:center;}
  .controls button{padding:10px 18px;font-size:1.1rem;cursor:pointer;
    background:#805dd4;border:2px solid #9e7fdc;border-radius:12px;color:#fff;
    transition:0.2s;}
  .controls button:hover{background:#9d78d0;}
</style>
</head>
<body>
  <h1>2022개정교육과정 추천어휘 [초등] 62회</h1>
  <div class="index" id="wordIndex">단어 1 / 10</div>
  <div class="card" id="flashcard">Loading…</div>
  <div class="image" id="imageBox">이미지 없음</div>
  <div class="controls">
    <button onclick="prevWord()">← 이전</button>
    <button onclick="nextWord()">다음 →</button>
    <button onclick="speakWord()">발음 듣기</button>
    <button onclick="toggleRandom()" id="randomBtn">랜덤 꺼짐</button>
  </div>
  <script>
    const words = [{"en": "shy", "ko": "수줍은", "img": "images/shy.png"}, {"en": "sick", "ko": "아픈", "img": "images/sick.png"}, {"en": "side", "ko": "옆", "img": "images/side.png"}, {"en": "sing", "ko": "노래하다", "img": "images/sing.png"}, {"en": "sister", "ko": "여자 형제", "img": "images/sister.png"}, {"en": "sit", "ko": "앉다", "img": "images/sit.png"}, {"en": "six", "ko": "여섯", "img": "images/six.png"}, {"en": "size", "ko": "크기 / 사이즈", "img": "images/size.png"}, {"en": "skate", "ko": "스케이트 타다", "img": "images/skate.png"}, {"en": "ski", "ko": "스키 타다", "img": "images/ski.png"}];
    let index=0,showingEnglish=true,intervalId,spokenForCurrent=false;
    const flashcard=document.getElementById('flashcard'),
          wordIndex=document.getElementById('wordIndex'),
          imageBox=document.getElementById('imageBox');
    function updateIndex(){wordIndex.textContent="단어 "+(index+1)+" / "+words.length;}
    function showWord(){const w=words[index];
      flashcard.textContent=showingEnglish?w.en:w.ko;
      updateIndex();
      imageBox.style.backgroundImage = w.img ? `url('${w.img}')` : 'none';
      imageBox.textContent = w.img ? '' : '이미지 없음';
      if(showingEnglish && !spokenForCurrent){speakWord();spokenForCurrent=true;}
      showingEnglish = !showingEnglish;
    }
    function speakWord(){let u=new SpeechSynthesisUtterance(words[index].en);u.lang='en-US';speechSynthesis.speak(u);}
    
let isRandom=false;
function toggleRandom(){
  isRandom=!isRandom;
  document.getElementById('randomBtn').textContent = isRandom?'랜덤 켜짐':'랜덤 꺼짐';
}
function nextWord(){
  if(isRandom){
    let prev=index;
    while((index=Math.floor(Math.random()*words.length))===prev){}
  } else {
    index=(index+1)%words.length;
  }
  showingEnglish=true; spokenForCurrent=false; showWord();
}

    function prevWord(){index=(index-1+words.length)%words.length;showingEnglish=true;spokenForCurrent=false;showWord();}
    showWord();intervalId = setInterval(showWord,1500);
  </script>
  
<script>
// F12, Ctrl+Shift+I/J/C, Ctrl+U 차단
document.addEventListener('keydown', e => {
  if(e.key==='F12' || (e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(e.key)) || (e.ctrlKey&&e.key==='U')){
    e.preventDefault();return false;
  }
});
// 우클릭 메뉴 차단
document.addEventListener('contextmenu', e=>{e.preventDefault();return false;});
// DevTools 열림 감지
(function(){
  const threshold=160;
  setInterval(()=>{ if(window.outerHeight-window.innerHeight>threshold){
    document.body.innerHTML='<h2>접근이 제한되었습니다</h2>';
  } },1000);
})();
</script>

</body>
</html>
