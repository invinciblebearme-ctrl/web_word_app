<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>매일 오늘의 영단어 UP!</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- 네비게이션 -->
    <header>
        
    </header>

    <!-- 검색창 -->
    <div class="search-container" style="width:100%; margin-top:50px; text-align: center;">
        <p class="title" style="text-align:center;">검색으로 찾기</p>
        <div style="display: inline-block; margin:10px 0;">
            <input type="text" id="searchInput" placeholder="🔍 회차로 찾기"
                oninput="searchItems()" 
                style="width: 250px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;"/>
            <button id="clearButton" onclick="clearSearch()" class="dark-button"
                style="padding: 8px 12px; border-radius: 5px; border: none; background-color: #333; color: white; cursor: pointer; margin-left:5px;">
                초기화
            </button>
        </div>
    </div>

    <!-- 도구 목록 -->
    <div class="container"></div>

    <script src="index.js" defer></script>

</body>

</html>
